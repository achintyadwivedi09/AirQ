<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Smart Air Pollution Monitoring Portal — Real-time air quality dashboard for Indian cities with IoT sensor simulation.">
    <title>AirQ — Smart Air Pollution Monitoring Portal</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Chart.js from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>

    <!-- App CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Sidebar Navigation -->
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <span class="logo-icon">🌍</span>
                <div class="logo-text">
                    <span class="logo-title">AirQ</span>
                    <span class="logo-subtitle">Pollution Monitor</span>
                </div>
            </div>
            <button class="sidebar-close" id="sidebar-close" aria-label="Close menu">✕</button>
        </div>

        <ul class="nav-menu">
            <li><a href="#/dashboard" class="nav-link active" data-page="dashboard">
                <span class="nav-icon">📊</span><span class="nav-text">Dashboard</span>
            </a></li>
            <li><a href="#/live" class="nav-link" data-page="live">
                <span class="nav-icon">📡</span><span class="nav-text">Live Monitoring</span>
            </a></li>
            <li><a href="#/cities" class="nav-link" data-page="cities">
                <span class="nav-icon">🏙️</span><span class="nav-text">Cities</span>
            </a></li>
            <li><a href="#/history" class="nav-link" data-page="history">
                <span class="nav-icon">📈</span><span class="nav-text">Historical Analytics</span>
            </a></li>
            <li><a href="#/forecast" class="nav-link" data-page="forecast">
                <span class="nav-icon">🔮</span><span class="nav-text">Forecast</span>
            </a></li>
            <li><a href="#/alerts" class="nav-link" data-page="alerts">
                <span class="nav-icon">🔔</span><span class="nav-text">Alerts</span>
            </a></li>
            <li><a href="#/sensors" class="nav-link" data-page="sensors">
                <span class="nav-icon">📟</span><span class="nav-text">IoT Sensors</span>
            </a></li>
            <li><a href="#/about" class="nav-link" data-page="about">
                <span class="nav-icon">ℹ️</span><span class="nav-text">About</span>
            </a></li>
        </ul>

        <div class="sidebar-footer">
            <div class="data-status" id="data-status">
                <span class="status-dot online"></span>
                <span class="status-text">Connecting...</span>
            </div>
        </div>
    </nav>

    <!-- Mobile topbar -->
    <header class="topbar" id="topbar">
        <button class="hamburger" id="hamburger" aria-label="Open menu">☰</button>
        <span class="topbar-title">AirQ — Pollution Monitor</span>
        <div class="topbar-actions">
            <span class="data-badge" id="topbar-badge"></span>
        </div>
    </header>

    <!-- Main content area -->
    <main class="main-content" id="main-content">
        <div id="page-container" class="page-container">
            <!-- Pages are rendered here by the router -->
            <div class="loading-screen" id="initial-loader">
                <div class="loader-spinner"></div>
                <p>Loading AirQ Portal...</p>
            </div>
        </div>
    </main>

    <!-- App JS -->
    <script src="js/api.js"></script>
    <script src="js/components.js"></script>
    <script src="js/pages.js"></script>
    <script src="js/router.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
